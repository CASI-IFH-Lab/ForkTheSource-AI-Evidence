# ForkTheSource settings. Read ONLY by src/settings.py - nothing else opens this file.
# Credentials do NOT live here; they live in .env (see .env.example).
# There are no defaults in code: a missing key raises. See docs/config_reference.md.

models:
  extractor:        qwen3-30b-a3b-instruct-2507      # P2, reference extraction
  judge:            qwen3-235b-a22b-thinking-2507    # A1, the LLM judge

temperature: 0.1

# P3 cache + P4 resolvers
resolvers:
  cache_dir: cache/
  cache_ttl_hours: 72
  timeout_seconds: 10                                # HTTP timeout, not the LLM one
  providers: [crossref, openalex, arxiv]             # P4 waterfall order
  # NO mailto key here. The Crossref polite-pool address is per-person, so it lives in
  # .env as CROSSREF_MAILTO - see docs/decisions.md D-007. P4 must refuse to start when
  # it is unset, because demotion out of the polite pool is silent.

# Every LLM call, any stage
llm:
  timeout_seconds: 60
  max_retries: 1

cache:
  schema_version: 1                                  # bump to invalidate cached payloads

# P5 rule-based classifier signal cutoffs. From the plan - do not retune casually.
thresholds:
  title_strong: 0.92
  title_weak: 0.70
  author_strong: 0.60
  year_tolerance: 1

# P6 / A1 priority formula, from the plan's P6 step 2. Read by src/priority.py (B1,
# shared infra) via src.settings - see docs/decisions.md D-009 and D-032.
#
#   severity(status)
#     * min(1.0, usage_base + usage_step * max(0, citing_claims))
#     * confidence
#     + retracted_bonus if 'retracted' in indicators
#   clamped to [0, cap]
#
# ALL FIVE are plan-sourced, like the four thresholds above - do not retune casually.
# There are no defaults in code: compute_priority() raises naming the missing keys rather
# than guessing, because a plausible wrong score silently reorders the reviewer worklist,
# which is the one output a human actually reads.
priority:
  # STATUS severities. The plan has no per-indicator severity.
  severity:
    conflict: 1.0
    needs_check: 0.6
    unresolvable: 0.5
    verified: 0.0
  usage_base: 0.4        # floor for a reference cited by zero claims
  usage_step: 0.2        # added per citing claim; usage saturates at 3 claims
  retracted_bonus: 0.3   # flat addition when the retracted indicator is present
  cap: 1.0               # upper clamp on the final score

# The accusation guard. Scanned by A1's gate.py against every rationale and check.
banned_terms: [fake, fabricated, invented, nonexistent, fraud, plagiarism,
               irreproducible, "not reproducible", sloppy, "AI-generated",
               "AI-written"]
